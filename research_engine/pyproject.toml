[project]
name = "kan-open-research-lab-worker"
version = "0.1.0"
description = "Isolated compute-node skeleton; no ML dependencies yet"
requires-python = ">=3.12,<3.14"
dependencies = []

[project.scripts]
kan-worker = "kan_worker.worker:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kan_worker"]
