name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.5-alpine@sha256:6567bca8d7bc8c82c5922425a0baee57be8402df92bae5eacad5f01ae9544daa
        env:
          POSTGRES_DB: kan_ci
          POSTGRES_USER: kan_ci
          POSTGRES_PASSWORD: ci-only
        options: >-
          --health-cmd "pg_isready -U kan_ci -d kan_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://kan_ci:ci-only@127.0.0.1:5432/kan_ci
      DATABASE_ENV: production
      DJANGO_SECRET_KEY: ci-only-7f9a4d2c8e1b6a3f5d0c9e7b2a4f8d1c6e3b5a9f0d7c2e4b8a1f6d3c9e5b7a2f
      DJANGO_ALLOWED_HOSTS: ci.invalid
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
          cache: pip
      - name: Install uv
        run: python -m pip install uv==0.11.7
      - name: Sync locked dependencies
        run: uv sync --locked --group dev
      - name: Format and lint
        run: |
          uv run ruff format --check .
          uv run ruff check .
      - name: Type check
        run: uv run mypy src
      - name: Tests
        run: uv run pytest
      - name: PostgreSQL integration and migration drift
        env:
          DJANGO_SETTINGS_MODULE: src.config.settings.development
        run: |
          uv run python manage.py migrate --noinput
          uv run python manage.py shell -c "from django.db import connection; connection.cursor().execute('SELECT 1')"
          uv run python manage.py makemigrations --check --dry-run
      - name: Django deployment checks
        env:
          DJANGO_SETTINGS_MODULE: src.config.settings.production
        run: uv run python manage.py check --deploy --fail-level WARNING
      - name: Dependency audit
        run: uv run pip-audit
      - name: Verify worker lock
        run: uv lock --project research_engine --check

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DJANGO_SETTINGS_MODULE: src.config.settings.development
      DJANGO_SECRET_KEY: ci-only-ui-shell
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
      - name: Install uv
        run: python -m pip install uv==0.11.7
      - name: Sync Python dependencies
        run: uv sync --locked --group dev
      - name: Install browser test dependencies
        run: npm ci
      - name: Audit browser dependencies
        run: npm audit --audit-level=high
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser, responsive and accessibility checks
        run: npm run test:ui
      - name: Upload browser evidence on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-evidence
          path: artifacts/playwright/
          if-no-files-found: ignore
          retention-days: 7
