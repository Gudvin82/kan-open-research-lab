name: Governance

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  governance:
    name: governance
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Require project control documents
        shell: bash
        run: |
          set -euo pipefail
          test -s README.md
          test -s AGENTS.md
          test -s .specify/memory/constitution.md
          test -s docs/THREAT_MODEL.md

      - name: Reject forbidden tracked paths
        shell: bash
        run: |
          set -euo pipefail
          forbidden_pattern='(^|/)(\.env($|\.)|logs/|data/private/|datasets/private/|artifacts/|checkpoints/)'
          if git ls-files \
            | grep -E "${forbidden_pattern}" \
            | grep -vE '(^|/)\.env\.example$'; then
            echo "Forbidden private/runtime path is tracked."
            exit 1
          fi

      - name: Reject common secret material
        shell: bash
        run: |
          set -euo pipefail
          if git grep -IlE 'BEGIN (RSA|OPENSSH|EC) PRIVATE KEY' -- .; then
            echo "Private key material found in tracked files."
            exit 1
          fi
          if git grep -IlE 'postgres(ql)?://[^[:space:]]+:[^[:space:]@]+@' \
            -- . \
            ':(exclude).env.example' \
            ':(exclude).github/workflows/quality.yml' \
            ':(exclude)compose.yaml' \
            ':(exclude)tests/**'; then
            echo "Potential database credential found outside approved examples."
            exit 1
          fi

      - name: Validate internal Markdown links
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r target; do
            case "${target}" in
              http://*|https://*|\#*|mailto:*|"") continue ;;
            esac
            path="${target%%#*}"
            test -e "${path}" || {
              echo "Missing Markdown target: ${target}"
              exit 1
            }
          done < <(sed -nE 's/.*\]\(([^)]+)\).*/\1/p' README.md)
